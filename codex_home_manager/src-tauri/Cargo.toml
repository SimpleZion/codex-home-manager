[package]
name = "codex-home-manager-desktop"
version = "1.0.34"
description = "Codex Cockpit desktop application"
authors = ["Codex Cockpit contributors"]
edition = "2021"
rust-version = "1.85"
license = "MIT"

[workspace]
members = ["native-service"]
resolver = "2"

[lib]
name = "codex_home_manager_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5.6", features = [] }

[dependencies]
reqwest = { version = "0.13.4", default-features = false, features = ["json"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
tauri = { version = "2.11.5", features = ["image-ico"] }
tauri-plugin-single-instance = "2.4.3"
tauri-plugin-window-state = "2.4.1"
tokio = { version = "1.53.1", features = ["sync", "time"] }
uuid = { version = "1.24.1", features = ["v4"] }
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_System_JobObjects", "Win32_System_Threading"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
