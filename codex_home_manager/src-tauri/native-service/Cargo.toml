[package]
name = "codex-home-manager-service"
version = "1.0.34"
edition = "2021"
rust-version = "1.85"
license = "MIT"
publish = false

[dependencies]
axum = { version = "0.8.8", features = ["http1", "json", "tokio"] }
base64 = "0.22.1"
chrono = { version = "0.4.42", default-features = false, features = ["std", "clock"] }
memchr = "2.7.6"
memmap2 = "0.9.9"
regex = "1.12.3"
reqwest = { version = "0.13.4", default-features = false, features = ["json", "stream"] }
fs2 = "0.4.3"
rusqlite = { version = "0.38.0", features = ["backup", "bundled", "hooks"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
sha2 = "0.10.9"
tokio = { version = "1.53.1", features = ["macros", "net", "process", "rt-multi-thread", "sync", "time"] }
toml_edit = "0.25.13"
tower-http = { version = "0.6.8", features = ["cors"] }
uuid = { version = "1.24.1", features = ["v4"] }
unicode-casefold = "0.2.0"
unicode-general-category = "1.1.0"
unicode-normalization = "0.1.25"
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_Diagnostics_ToolHelp", "Win32_System_Threading"] }

[dev-dependencies]
tempfile = "3.27.0"
